- insert:
    - id: code-pipeline
      name: '@local/dsh-code-pipeline'
      config:
        backend: spawn
        startMode: auto
        maxRepairs: 1
        routes:
          direction: { provider: openai, model: gpt-6-sol }
          planning: { provider: anthropic, model: latest-opus }
          design: { provider: openai, model: gpt-6-sol }
          execution: { provider: deepseek-account, model: deepseek-flash }
          verification: { provider: openai, model: gpt-6-sol }
          deepReview: { provider: anthropic, model: latest-opus }
          diagnostics: { provider: anthropic, model: latest-opus }
          summarize: { provider: deepseek-account, model: deepseek-flash }
